name: Feature request
description: Suggest a new metric, chart, output format or CLI option
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What question about your repository would this answer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The command, flags, JSON fields or chart you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this
